[project]
name = "base32-zooko-encoder"
version = "0.1.2"
description = "Encodes and decodes using the Z-Base32 alphabet optimized for human readability and transcription by Zooko."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
